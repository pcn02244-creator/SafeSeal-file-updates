<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 파트 단가 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: #1c1f2e;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 40px 36px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      color: #e2e8f0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .logo p {
      color: #64748b;
      font-size: 12px;
      margin-top: 4px;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="password"]:focus { border-color: #3b82f6; }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 11px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    .err {
      margin-top: 12px;
      color: #f87171;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>파트 단가 관리</h1>
      <p>한솔아이원스 안성사업장</p>
    </div>
    <label>비밀번호</label>
    <input type="password" id="pw" placeholder="비밀번호 입력" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">로그인</button>
    <div class="err" id="err">비밀번호가 올바르지 않습니다.</div>
  </div>

  <script>
    const HASH = 'a7ad4db69696676eedd1e1720806d44eacdbe5dc78e3a70ec174cf9a3771a6b4';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function doLogin() {
      const pw = document.getElementById('pw').value;
      const h = await sha256(pw);
      if (h === HASH) {
        sessionStorage.setItem('iones_auth_v1', '1');
        const redir = sessionStorage.getItem('iones_redirect');
        sessionStorage.removeItem('iones_redirect');
        location.replace(redir && !redir.includes('login.html') ? redir : 'parts-mgmt.html');
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
</body>
</html>
