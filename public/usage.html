<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사용 입력 - 파트 단가 관리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-bold">⚙️ 파트 단가 관리 시스템</span>
    <div class="d-flex gap-3">
      <a href="index.html" class="nav-link text-white">대시보드</a>
      <a href="parts.html" class="nav-link text-white">파트 관리</a>
      <a href="lots.html" class="nav-link text-white">배치 관리</a>
      <a href="history.html" class="nav-link text-white">이력 조회</a><a href="quotation.html" class="nav-link text-white">견적 생성</a>
      <a href="master-fill.html" class="nav-link text-white">마스터 업데이트</a>
    </div>
  </nav>

  <div class="container p-4" style="max-width: 700px;">
    <h5 class="mb-4">📥 파트 사용 입력 <span class="badge bg-info text-dark">구매팀</span></h5>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">교체 날짜 <span class="text-danger">*</span></label>
          <input type="date" class="form-control" id="f-date">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Part Number <span class="text-danger">*</span></label>
          <select class="form-select font-monospace" id="f-pn" onchange="updatePreview()">
            <option value="">-- 파트 선택 --</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">이번 교체 수량 <span class="text-danger">*</span></label>
          <input type="number" class="form-control" id="f-qty" placeholder="0" min="1" oninput="updatePreview()">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">입력자</label>
          <select class="form-select" id="f-team">
            <option value="구매팀">구매팀</option>
            <option value="영업팀">영업팀</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">비고</label>
          <input type="text" class="form-control" id="f-note" placeholder="선택 입력">
        </div>

        <!-- 미리보기 -->
        <div id="preview" class="alert alert-info d-none">
          <div class="fw-bold mb-2">📋 입력 후 예상 현황</div>
          <div id="preview-content"></div>
        </div>

        <button class="btn btn-primary w-100" onclick="submit()">저장</button>
      </div>
    </div>

    <div id="result" class="d-none"></div>
  </div>

  <!-- Supabase + core.js (다중 PC 공유 데이터) -->
  <script src="js/supabase.umd.js?v=2385"></script>
  <script src="js/core.js?v=20260911"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let partsData = [];

    // ── 파트 목록 로드 (Supabase → localStorage 캐시 기반) ──
    async function loadParts() {
      // Supabase에서 최신 데이터 로드 후 localStorage 캐시 갱신
      await initData();

      const parts    = DB.parts.get();
      const usageAll = DB.usage.get();

      // 파트별 누적 사용량 계산
      const cumMap = {};
      usageAll.forEach(u => {
        cumMap[u.part_number] = (cumMap[u.part_number] || 0) + u.quantity;
      });

      partsData = parts
        .map(p => ({ ...p, cumulative: cumMap[p.part_number] || 0 }))
        .sort((a, b) => (a.type + a.part_number).localeCompare(b.type + b.part_number));

      const sel = document.getElementById('f-pn');
      sel.innerHTML = '<option value="">-- 파트 선택 --</option>';
      partsData.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.part_number;
        opt.textContent = `${p.part_number} (${p.type || ''}) - 현재 누적: ${p.cumulative}개`;
        sel.appendChild(opt);
      });

      document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
    }

    function updatePreview() {
      const pn  = document.getElementById('f-pn').value;
      const qty = parseInt(document.getElementById('f-qty').value) || 0;
      if (!pn || !qty) { document.getElementById('preview').classList.add('d-none'); return; }

      const part = partsData.find(p => p.part_number === pn);
      if (!part) return;

      const newCumulative = part.cumulative + qty;
      const threshold     = part.qty_threshold || 0;

      let html = `<table class="table table-sm mb-0">`;
      html += `<tr><td>현재 누적 수량</td><td class="fw-bold">${part.cumulative.toLocaleString()}개</td></tr>`;
      html += `<tr><td>이번 수량</td><td class="fw-bold text-primary">+${qty.toLocaleString()}개</td></tr>`;
      html += `<tr><td>입력 후 누적</td><td class="fw-bold">${newCumulative.toLocaleString()}개</td></tr>`;
      html += `<tr><td>Q'ty 기준</td><td>${threshold.toLocaleString()}개</td></tr>`;

      if (threshold > 0 && part.cumulative <= threshold && newCumulative > threshold) {
        const asIsQty = threshold - part.cumulative;
        const toBeQty = qty - asIsQty;
        html += `<tr class="table-warning"><td colspan="2">⚠️ 이번 입력으로 단가 전환 발생!</td></tr>`;
        html += `<tr><td>&nbsp;&nbsp;As-is 적용 수량</td><td>${asIsQty}개 × $${(part.price_as_is||0).toFixed(2)} = $${(asIsQty*(part.price_as_is||0)).toLocaleString('en',{minimumFractionDigits:2})}</td></tr>`;
        html += `<tr><td>&nbsp;&nbsp;To-be 적용 수량</td><td>${toBeQty}개 × $${(part.price_to_be||0).toFixed(2)} = $${(toBeQty*(part.price_to_be||0)).toLocaleString('en',{minimumFractionDigits:2})}</td></tr>`;
      } else {
        const appliedPrice = (threshold > 0 && newCumulative > threshold) ? part.price_to_be : part.price_as_is;
        const priceType    = (threshold > 0 && newCumulative > threshold) ? 'To-be' : 'As-is';
        const badgeClass   = (threshold > 0 && newCumulative > threshold) ? 'bg-danger' : 'bg-success';
        html += `<tr><td>적용 단가</td><td><span class="badge ${badgeClass}">${priceType}</span> $${(appliedPrice||0).toFixed(2)}</td></tr>`;
        html += `<tr><td>이번 청구 금액</td><td class="fw-bold text-primary">$${(qty*(appliedPrice||0)).toLocaleString('en',{minimumFractionDigits:2})}</td></tr>`;
      }
      html += `</table>`;

      document.getElementById('preview-content').innerHTML = html;
      document.getElementById('preview').classList.remove('d-none');
    }

    async function submit() {
      const date = document.getElementById('f-date').value;
      const pn   = document.getElementById('f-pn').value;
      const qty  = document.getElementById('f-qty').value;
      const team = document.getElementById('f-team').value;
      const note = document.getElementById('f-note').value;

      if (!date || !pn || !qty) {
        alert('날짜, Part Number, 수량은 필수 입력 항목입니다.');
        return;
      }

      const btn = document.querySelector('button[onclick="submit()"]');
      if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }

      try {
        const nowStr   = new Date().toLocaleString('ko-KR');
        const usageAll = DB.usage.get();
        const newId    = usageAll.length ? Math.max(...usageAll.map(u => u.id)) + 1 : 1;
        const newRec   = {
          id: newId, date, part_number: pn,
          quantity: parseInt(qty), note: note || '',
          team: team || '', source: 'manual', created_at: nowStr,
        };

        const sb = getSB();
        if (!sb) throw new Error('Supabase 미연결 — 네트워크 또는 페이지를 새로고침하세요');

        // ── Supabase에 저장 (중앙 DB) ──
        const { error } = await sb.from('usage').upsert(newRec, { onConflict: 'id' });
        if (error) throw new Error(error.message);
        // 캐시 갱신
        await initData();

        const resultDiv = document.getElementById('result');
        resultDiv.className = 'alert alert-success';
        resultDiv.innerHTML  = `✅ 저장 완료! (${pn} / ${qty}개 / ${date}) — 모든 PC에서 공유됩니다`;
        resultDiv.classList.remove('d-none');

        document.getElementById('f-pn').value  = '';
        document.getElementById('f-qty').value  = '';
        document.getElementById('f-note').value = '';
        document.getElementById('preview').classList.add('d-none');
        loadParts();
        setTimeout(() => resultDiv.classList.add('d-none'), 4000);

      } catch(e) {
        alert('❌ 저장 실패: ' + e.message);
        console.error('[usage] submit 오류:', e);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '저장'; }
      }
    }

    loadParts();
  </script>
</body>
</html>
